<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/assets/styles/login.css" />
    <title>Entrar - Estilo&Conforto</title>
  </head>
  <body>
    <section class="limiter">
      <section class="container">
        <div class="wrap-login">
          <div class="logo">
            <img src="/src/assets/images/logo2.png" alt="Logo Estilo e conforto" />
          </div>
          <div class="login-form">
            <form action="" method="post">
              <div class="title-login">
                <h1>ENTRAR</h1>
                <div class="bar"></div>
              </div>
              <div class="inputs general">
                <label type="text">USUÁRIO</label>
                <input type="text" id="username" value="" />
              </div>

              <div class="inputs general">
                <label for="password">Senha</label>
                <input type="password" id="pass" />
              </div>

              <div class="checkbox general">
                <input type="checkbox" name="check" />
                <p>Lembrar-me</p>
              </div>
            </form>

            <div class="btn general">
              <button type="button">Entrar</button>
            </div>
          </div>
        </div>
      </section>
    </section>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/assets/styles/login.css" />
    <title>Entrar - Estilo&Conforto</title>
  </head>
  <body>
    <main class="login-page">
      <div class="login-container">
        <div class="login-card">
          <div class="login-card__logo">
            <img src="/src/assets/images/logo2.png" alt="Logo Estilo e conforto" />
          </div>
          <div class="login-card__form-wrapper">
            <form class="login-form" action="" method="post">
              <div class="login-form__title">
                <h1>ENTRAR</h1>
                <div class="login-form__divider"></div>
              </div>
              <div class="form-group">
                <label for="username">USUÁRIO</label>
                <input type="text" id="username" value="" />
              </div>

              <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" />
              </div>

              <div class="form-group form-group--checkbox">
                <input type="checkbox" id="remember-me" name="check" />
                <label for="remember-me">Lembrar-me</label>
              </div>
              <div class="login-form__actions ">
                <button type="submit">Entrar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
